name: Noticias Overwatch

on:
  schedule:
    - cron: '17 */6 * * *'   # a cada 6 horas: a cada 3 h estourava os 2000 min/mes gratis do repo privado (out/2026)
  workflow_dispatch:
    inputs:
      teste:
        description: 'Postar a ultima nota de patch agora (para testar)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar noticias e postar no Discord
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_OVERWATCH: ${{ secrets.WEBHOOK_OVERWATCH }}
          WEBHOOK_DOOMFIST: ${{ secrets.WEBHOOK_DOOMFIST }}
        run: python noticias.py ${{ inputs.teste && '--postar-ultimo 1' || '' }}

      - name: Guardar o que ja foi postado
        if: always()   # mesmo se a rodada falhar/estourar, salva o que ja saiu (evita repetir no Discord)
        run: |
          git config user.name 'kira-news-bot'
          git config user.email 'kira-news-bot@users.noreply.github.com'
          git add vistos.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'noticias vistas' && git push)
