name: Noticias Overwatch

on:
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      teste:
        description: 'Postar a ultima nota de patch agora (para testar)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar noticias e postar no Discord
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_OVERWATCH: ${{ secrets.WEBHOOK_OVERWATCH }}
          WEBHOOK_DOOMFIST: ${{ secrets.WEBHOOK_DOOMFIST }}
        run: python noticias.py ${{ inputs.teste && '--postar-ultimo 1' || '' }}

      - name: Guardar o que ja foi postado
        run: |
          git config user.name 'kira-news-bot'
          git config user.email 'kira-news-bot@users.noreply.github.com'
          git add vistos.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'noticias vistas' && git push)
